<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Project</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        .container{
            height:100vh;
            width:100vw;
             background: linear-gradient(45deg, #54d8f0 0.000%, #acdfe4 8.333%, #98bcbe 16.667%, #1068c2 25.000%, #1276e3 33.333%, #1585ff 41.667%, #1896ff 50.000%, #1ca9ff 58.333%, #1fbcff 66.667%, #23d1ff 75.000%, #27e6ff 83.333%, #2bfbff 91.667%, #2fffff 100.000%);
            Display:flex;
             justify-content: center;
            align-items:center;
            flex-direction:column;
            
        }
        .box{
            height:540px;
            width:360px;
            background-color: azure;
            border:1px solid white;
            border-radius: 10px;
            position:absolute;
            display:flex;
            justify-content:start;
            align-items:center;
            flex-direction:column;
            

        }
        .box img{
            height:30%;
            width:100%;
           border-top-left-radius: 10px;
           border-top-right-radius: 10px;
            position:relative;
            /* margin:10px; */


        }
        .box h2{
            margin:20px;
        }
        .box p{
            padding:20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <img src="book.png" alt="Html">
            <h2>Order Summary</h2>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Fugit fuga aliquam, voluptatibus vel sint in ad mollitia dignissimos cumque tenetur?</p>
        </div>
    </div>
    
</body>
</html>
