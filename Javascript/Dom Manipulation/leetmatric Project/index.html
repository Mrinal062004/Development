<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leet Metric</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>LeetMetric</h1>
    <div class="user-container">
        <p>Enter Your Username  below:</p>

    
    <div class="user-input-container"><input type="text" placeholder="enter username of user" id="user-input">
        <button id="search-btn">Search</button>
    </div>
     </div>
     
    
    <div class="stats-container" >
        <div class="progress">
            <div class="progress-item circle">
                <div class="easy-progress ">
                    <span id="easy-label">Easy</span>
                </div>
            </div>
            <div class="progress-item circle">
                <div class="medium-progress">
                    <span id="medium-label">Medium</span>
                </div>
            </div>
            <div class="progress-item circle">
                <div class="hard-progress">
                    <span id="hard-label">Hard</span>
                </div>
            </div>

            <div class="stats-cards">
                <!-- Directly populated card from the Js code -->
            </div>
        </div>
    </div>
</div>
    </body>

    <script src="index.js"></script>
</body>
</html>
