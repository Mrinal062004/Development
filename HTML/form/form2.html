<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>
        Job Application
    </h2>
    <label for="Name">Name</label><br>
    <input type="text" name="Name",id="Name" placeholder=" Enter the Name"><br><br>
    <label for="Email">Email</label><br>
    <input type="text" name="Email",id="Email" placeholder=" Enter the Email"><br><br>
    <label for="Phone">Phone </label><br>
    <input type="text" name="Phone",id="Phone" placeholder=" Enter the phone No"><br><br>
    <label for ="file">Resume</label><br>
    <input type="file" name="Resume" id="Resume" placeholder="select your resume"><br><br>
    <label for ="counter">Experience(in years)</label><br>
    <input type="number" name="counter" id="counter" min="0" max="50" placeholder="Experience"><br><br>
    <fieldset><legend>SKILlS</legend>
    <label for="Interest">HTML</label>
    <input type="checkbox" id="Interest" Name ="Html">
    <label for="Interest">CSS</label>
    <input type="checkbox" id="Interest" Name ="CSS">
    <label for="Interest">PYTHON</label>
    <input type="checkbox" id="Interest" Name ="PYTHON">
    <label for ="Other">Others</label>
    <input type ="text" name="Skills"><br><br>
    </fieldset>
    <label for ="Highest Qualification">Highest Qualification</label><br>
    <select name="Highest Qualification" id="Qualification">
        <option value="12">Intermediate</option>
        <option value="Graduate">Graduate</option>
        <option value="PostGraduate">PostGrad</option>
        <option value="Doctorate">Doctorate</option>
    </select><br><br>
    <fieldset>
        <legend>Availabilty</legend>
       <label for ="part time">part time</label>
        <input type="radio" name="Availability"><br>
        <label for ="Full time"> Full time</label>
       <input type="radio" name="Availability">
    </fieldset>
    <label for ="text box">Comments(additional skills or information)</label><br>
    <textarea name="Text box" id="text box" placeholder="enter the required information" row="10" cols="15"></textarea><br>
    <button>Submit</button>
    

    
</body>
</html>
